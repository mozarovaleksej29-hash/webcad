<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-САПР — тест</title>
    <style>
        body {
            background: #0d0d1a;
            color: #64b5f6;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 24px; }
        p { color: #a0b4c8; font-size: 14px; }
    </style>
</head>
<body>
    <div>
        <h1>✅ Веб-САПР работает</h1>
        <p>APK собран, WebView загрузился</p>
        <p>Пользователь: <span id="user"></span></p>
    </div>
    
    <script src="js/user-id.js"></script>
    <script src="js/db.js"></script>
    <script src="js/php-shim.js"></script>
    <script>
        (async function() {
            document.getElementById('user').textContent = WebCADUser.getUserName();
            
            // Тест IndexedDB
            await WebCAD_DB.openDB();
            const projects = await WebCAD_DB.getProjects();
            console.log('Проектов в базе:', projects.length);
            
            // Тест php-shim
            const resp = await fetch('api/projects.php');
            const data = await resp.json();
            console.log('php-shim ответ:', data);
        })();
    </script>
</body>
</html>
